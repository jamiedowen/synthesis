name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: Windows
          - name: macOS
            os: macos-latest
            platform: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3s
        run: cmake --build build --config Release --target MidnightEdge_VST3 MidnightGrind_VST3 --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/edge dist/grind
          cp -R "build/MidnightEdge_artefacts/Release/VST3/Midnight Edge.vst3" dist/edge/
          cp README.md dist/edge/
          cp -R "build/Grind/MidnightGrind_artefacts/Release/VST3/Midnight Grind.vst3" dist/grind/
          cp Grind/README.md dist/grind/
          cp Grind/ThirdParty/mutable/LICENSE dist/grind/LICENSE-MutableInstruments.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MidnightEdge-${{ matrix.platform }}-VST3
          path: dist/edge

      - uses: actions/upload-artifact@v4
        with:
          name: MidnightGrind-${{ matrix.platform }}-VST3
          path: dist/grind

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
